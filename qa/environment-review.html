<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living World — Environment Review</title><style>
@font-face{font-family:Lilita;src:url('../vendor/lilita-one.ttf')}*{box-sizing:border-box}body{margin:0;background:#13271e;color:#f2e8c9;font:14px system-ui}main{max-width:1250px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:32px Lilita;margin:0 0 8px}p{color:#b3c7ad;line-height:1.7;font-size:12px}a{color:#e7cf8d}section{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}article{background:radial-gradient(#365d43,#223f2d);border:1px solid #5c7553;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:1}h2{font:18px Lilita;text-align:center;margin:0 0 15px}.preview{display:flex;justify-content:center}#live{width:100%;height:500px;border:1px solid #5c7553;border-radius:14px;background:radial-gradient(#477c52,#284b35)}label{display:flex;align-items:center;gap:10px;margin:15px 0}select{padding:8px;background:#304d36;color:#f2e8c9;border:1px solid #779865;border-radius:6px}footer{font-size:11px;color:#9fb696;margin:25px 0}@media(max-width:700px){main{padding:17px}section{grid-template-columns:repeat(2,1fr)}#live{height:400px}h1{font-size:27px}}
</style></head><body><main><header><div><h1>Living World</h1><p>Rendered trees, snow, structures, resource props and utility artwork.</p></div><a href="../dist/index.html">Play local build →</a></header><label>Live prop <select id="select"></select></label><canvas id="live"></canvas><section id="gallery"></section><footer>Individual source bounds and root anchors are measured from alpha; nominal grid cells are not used to crop tall trees or wide roofs. Original PNGs are unchanged.</footer></main><script src="../vendor/three.min.js"></script><script src="../motion.js"></script><script src="../art-assets.js"></script><script src="../sprite-motion.js"></script><script src="../environment.js"></script><script src="../art-renderer.js"></script><script>
const T=THREE,canvas=document.getElementById('live'),renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene(),camera=new T.OrthographicCamera(-5,5,3.5,-3.5,.1,100);camera.position.set(0,24,17);camera.lookAt(0,1.8,0);const environment=WorldEnvironment.create(scene,()=>0);const names=Object.keys(WorldEnvironment.CATALOG);names.forEach(name=>environment.add(name,0,0,1));let selected='pine';document.getElementById('select').innerHTML=names.map(name=>`<option>${name}</option>`).join('');document.getElementById('select').onchange=e=>selected=e.target.value;document.getElementById('gallery').innerHTML=names.map(name=>`<article><canvas data-prop="${name}" width="280" height="280"></canvas><h2>${name}</h2></article>`).join('');const image=new Image();image.onload=()=>{document.querySelectorAll('[data-prop]').forEach(canvas=>{const frame=HeroArt.environment.frames[canvas.dataset.prop],ctx=canvas.getContext('2d'),scale=Math.min(250/frame.w,245/frame.h),w=frame.w*scale,h=frame.h*scale;ctx.drawImage(image,frame.x,frame.y,frame.w,frame.h,(280-w)/2,263-h,w,h);});};image.src=HeroArt.environment.data;function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,aspect=w/h;renderer.setSize(w,h,false);camera.left=-3.6*aspect;camera.right=3.6*aspect;camera.top=3.6;camera.bottom=-3.6;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(canvas);resize();let time=0,last=performance.now();HeroSprites.ready();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;environment.update(time,dt,{x:20,z:20});environment.objects.forEach(prop=>prop.root.visible=prop.kind===selected);renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></body></html>
